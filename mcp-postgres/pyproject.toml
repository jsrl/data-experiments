[project]
name = "mcp-postgres"
version = "1.0.0"
description = ""
authors = [
    {name = "Jose Luis Rosello", email = "jose.luis.rosello.ferrer@gmail.com"}
]
requires-python = ">=3.10.0,<3.12"
dependencies = [
    "fastmcp==2.12.0",
    "asyncpg==0.30.0",
    "typing-extensions==4.15.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # Basic style and errors
    "I",            # Import sorting
    "B",            # Bugbear (bug-prone patterns)
    "N",            # PEP8 naming
    "UP",           # Modernization (pyupgrade)
    "S",            # Basic security checks
    "C90",          # Cyclomatic complexity
]
ignore = [
    "E501",  # Line length
    "S101",  # Ignore assert-use warnings
]
